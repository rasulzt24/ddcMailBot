# Тестовая среда: своя БД, Redis, хранилище S3 и почтовый сервер с тестовыми ящиками.
# Рабочие БД, Redis, хранилище и почта банка не используются.
#
#   docker compose -f docker-compose.test.yml up -d       — поднять
#   docker compose -f docker-compose.test.yml down -v     — удалить вместе с данными
#
# Бот и воркер запускаются из venv с ENV_FILE=.env.test (см. TESTING.md).
name: mailbot-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mailbot_test
      POSTGRES_USER: mailbot
      POSTGRES_PASSWORD: mailbot-test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbot -d mailbot_test"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "mailbot-test"]
    ports:
      - "127.0.0.1:56379:6379"

  # Тестовый почтовый сервер: IMAPS 3993, SMTPS 3465 (самоподписанный сертификат).
  # Письма никуда наружу не уходят — любой адрес получателя создаёт ящик внутри GreenMail.
  # Данные в памяти: после перезапуска контейнера ящики пустые (заново: mail_seed_test).
  mail:
    image: greenmail/standalone:latest
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=me:test123@test.local,colleague:test123@test.local,boss:test123@test.local
        -Dgreenmail.users.login=email
    ports:
      - "127.0.0.1:3993:3993"   # IMAPS
      - "127.0.0.1:3465:3465"   # SMTPS
      - "127.0.0.1:18080:8080"  # веб-интерфейс / REST API GreenMail

  # S3-хранилище для вложений (как будет на сервере)
  s3:
    image: chrislusf/seaweedfs:latest
    command: >-
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=256
    ports:
      - "127.0.0.1:18333:8333"
    volumes:
      - s3_data:/data
      - ./docker/test/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pg_data:
  s3_data:
